
{% load static %}
<!-- Fixed Bottom Horizontal Social Icons -->
<div class="social-icons-horizontal">
    {% if profile_setting.facbook %}
    <a href="{{ profile_setting.facbook }}" target="_blank" class="social-icon facebook">
        <i class="icon icon-2 unicon-logo-facebook"></i>
    </a>
    {% endif %}

    {% if profile_setting.twitter %}
    <a href="{{ profile_setting.twitter }}" target="_blank" class="social-icon twitter">
        <i class="icon icon-2 unicon-logo-x-filled"></i>
    </a>
    {% endif %}

    {% if profile_setting.instagram %}
    <a href="{{ profile_setting.instagram }}" target="_blank" class="social-icon instagram">
        <i class="icon icon-2 unicon-logo-instagram"></i>
    </a>
    {% endif %}

    {% if profile_setting.youtube %}
    <a href="{{ profile_setting.youtube }}" target="_blank" class="social-icon youtube">
        <i class="icon icon-2 unicon-logo-youtube"></i>
    </a>
    {% endif %}

    {% if profile_setting.linkedin %}
    <a href="{{ profile_setting.linkedin }}" target="_blank" class="social-icon linkedin">
        <i class="unicon-logo-linkedin icon-2"></i>
    </a>
    {% endif %}

    
</div>

<style>
.social-icons-horizontal {
     position: fixed;
    bottom: 10px;
    left: 12%;
    width: 73%;
    background-color: #000000db;
    display: flex;
    justify-content: space-around;
    align-items: center;
    gap: 0;
    padding: 10px 0;
    z-index: 999;
    border-radius: 50px;

    /* Shadow */
    box-shadow: 0 8px 20px rgba(0,0,0,0.6), 0 0 15px rgba(255,255,255,0.1);
}

.social-icons-horizontal .social-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    color: #fff; /* icon color white */
    font-size: 20px;
    transition: all 0.3s ease;
    text-decoration: none;
    background: none; /* remove icon background */
    border-radius: 5px;
    margin-bottom: 0px;
}

.social-icons-horizontal .social-icon:hover { 
   color: #00ffff; /* glow color */
    text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
    transform: translateY(-3px);
}

.social-icons-horizontal .facebook:hover { color: #fef000; } /* yellow */
.social-icons-horizontal .twitter:hover { color: #1da1f2; }
.social-icons-horizontal .instagram:hover { color: #e1306c; }
.social-icons-horizontal .youtube:hover { color: #ff0000; }
.social-icons-horizontal .linkedin:hover { color: #0a66c2; }


</style>


  
  <script>
    function showSubmenu(id) {
      document.querySelectorAll('.submenu, .thirdmenu').forEach(menu => menu.style.display = 'none');
      document.getElementById(id).style.display = 'block';
    }

    function hideSubmenu(id) {
      document.getElementById(id).style.display = 'none';
    }
    function closeMenu() {
      document.getElementById('sideMenu').style.display = 'none';
    }
  </script>
  <script>
    function toggleMenu() {
      document.getElementById('sideMenu').classList.add('active');
    }
    function closeMenu() {
      document.getElementById('sideMenu').classList.remove('active');
      hideSubmenu('submenu');
      hideSubmenu('thirdmenu');
    }
    function showSubmenu(id) {
      document.getElementById(id).classList.add('active');
    }
    function hideSubmenu(id) {
      document.getElementById(id).classList.remove('active');
    }

    // Get modal and elements
    const modal = document.getElementById('subscribeModal');
    const notificationIcon = document.getElementById('notificationIcon');
    const closeModal = document.getElementById('closeModal');

    // When the user clicks on the notification icon, open the modal
    notificationIcon.onclick = function () {
      modal.style.display = 'flex';
    }

    // When the user clicks on <span> (x), close the modal
    closeModal.onclick = function () {
      modal.style.display = 'none';
    }

    // Close the modal if the user clicks outside the modal
    window.onclick = function (event) {
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    }
    
  </script>
  
  <!-- All JavaScript Files-->

</body>

</html>
