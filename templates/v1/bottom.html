<style>
.brand-track {
  display: flex;
  width: max-content;
}
.brand-track-row1 {
  animation: scroll-left 50s linear infinite;
}
@keyframes scroll-left {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.brand-logos {
  flex-shrink: 0;
  padding: 10px 10px;
}
.brand-logos img {
  max-height: 100px;
  width: auto;
  transition: filter 0.3s ease, transform 0.3s ease;
}
.brand-logos:hover img {
  transform: scale(1.1);
  filter: brightness(1.1);
  cursor: pointer;
}
.brand-slider-wrapper:hover .brand-track {
  animation-play-state: paused;
}
@media (max-width: 768px) {
  .brand-logos {
    padding: 8px 20px;
  }
  .brand-logos img {
    max-height: 70px;
  }
}
</style>
