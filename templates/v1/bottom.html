{% load static %}
{% load image_filters %}

<div id="brand-partners" class="section panel overflow-hidden container">
  <div class="section-outer panel pt-3 pb-3 sm:pb-6">
    <div class="">
      <div class="section-inner">
        <div class="row child-cols-12 lg:child-cols col-match g-3" data-uc-grid>

          <!-- Right Column -->
          <div class="lg:col-8">
            <div class="block-layout grid-layout vstack gap-4 panel">
              <div class="block-header panel min-h-40px px-2 py-1">
                <div>
                <h3 class="m-0 text-inherit dark:text-white gap-1 py-3 text-start border-bottom">
                  QUICK CUT
                </h3>
              </div>
              </div>

              <div class="block-content panel vstack gap-3">
                <div class="brand-slider-wrapper">
                  <div class="brand-track brand-track-row1">
                    {% for brandpartner in bplogo|slice:":9" %}
                    <div class="brand-logos">
                      <a href="{{ brandpartner.url }}" target="_blank">
                        <img src="{{ brandpartner.Logo.url|thumbnail_url }}" alt="{{ brandpartner.name }}" title="{{ brandpartner.name }}">
                      </a>
                    </div>
                    {% endfor %}
                    {% for brandpartner in bplogo|slice:":9" %}
                    <div class="brand-logos">
                      <a href="{{ brandpartner.url }}" target="_blank">
                        <img src="{{ brandpartner.Logo.url|thumbnail_url }}" alt="{{ brandpartner.name }}" title="{{ brandpartner.name }}">
                      </a>
                    </div>
                    {% endfor %}
                  </div>
                </div>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<style>
.brand-track {
  display: flex;
  width: max-content;
}
.brand-track-row1 {
  animation: scroll-left 50s linear infinite;
}
@keyframes scroll-left {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.brand-logos {
  flex-shrink: 0;
  padding: 10px 10px;
}
.brand-logos img {
  max-height: 100px;
  width: auto;
  transition: filter 0.3s ease, transform 0.3s ease;
}
.brand-logos:hover img {
  transform: scale(1.1);
  filter: brightness(1.1);
  cursor: pointer;
}
.brand-slider-wrapper:hover .brand-track {
  animation-play-state: paused;
}
@media (max-width: 768px) {
  .brand-logos {
    padding: 8px 20px;
  }
  .brand-logos img {
    max-height: 70px;
  }
}
</style>
