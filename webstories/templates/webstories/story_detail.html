{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ story.title }} | Web Stories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .story-viewer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .story-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: #000;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .slide.active {
            opacity: 1;
            z-index: 1;
        }

        .slide-media {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem 1.5rem;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 50%, transparent 100%);
            transform: translateY(100%);
            animation: slideUp 0.6s ease forwards;
            animation-delay: 0.3s;
            z-index: 2;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
            }
        }

        .slide-description {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .progress-bars {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            gap: 4px;
            padding: 0 1rem;
            z-index: 10;
        }

        .progress-bar-item {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: #fff;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-bar-item.completed .progress-bar-fill {
            width: 100%;
        }

        .progress-bar-item.active .progress-bar-fill {
            animation: progress linear forwards;
        }

        @keyframes progress {
            to {
                width: 100%;
            }
        }

        .header-info {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
        }

        .story-title {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(90deg);
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: none;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            opacity: 0;
        }

        .story-container:hover .nav-btn {
            opacity: 1;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-50%) scale(1.1);
        }

        .prev-btn {
            left: 1rem;
        }

        .next-btn {
            right: 1rem;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .share-btn {
            position: absolute;
            bottom: 100px;
            right: 1.5rem;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: none;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .share-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        .related-stories {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            max-width: 500px;
            width: 100%;
            background: rgba(0,0,0,0.95);
            padding: 1rem;
            display: none;
            z-index: 100;
        }

        .related-stories.show {
            display: block;
        }

        .related-story-item {
            display: flex;
            gap: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            text-decoration: none;
            color: #fff;
            transition: background 0.3s ease;
        }

        .related-story-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .related-story-thumb {
            width: 80px;
            height: 120px;
            border-radius: 8px;
            object-fit: cover;
        }

        .related-story-info h4 {
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        @media (min-width: 768px) {
            .story-container {
                max-width: 450px;
                height: 95vh;
                border-radius: 20px;
                overflow: hidden;
            }
        }

        .tap-zones {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            z-index: 5;
        }

        .tap-zone {
            flex: 1;
            cursor: pointer;
        }

        .paused-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(0,0,0,0.7);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 15;
        }

        .paused-overlay.show {
            display: flex;
        }

        .paused-overlay i {
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="story-viewer">
        <div class="story-container">
            <div class="progress-bars">
                {% for slide in slides %}
                <div class="progress-bar-item" data-slide="{{ forloop.counter0 }}">
                    <div class="progress-bar-fill"></div>
                </div>
                {% endfor %}
            </div>

            <div class="header-info">
                <div class="story-title">{{ story.title }}</div>
                <button class="close-btn" onclick="window.close()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            {% for slide in slides %}
            <div class="slide {% if forloop.first %}active{% endif %}" data-index="{{ forloop.counter0 }}">
                {% if slide.media_type == 'image' %}
                <img src="{{ slide.image.url }}" alt="Slide {{ forloop.counter }}" class="slide-media">
                {% elif slide.media_type == 'video' %}
                <video class="slide-media" loop muted playsinline>
                    <source src="{{ slide.video.url }}" type="video/mp4">
                </video>
                {% endif %}
                <div class="slide-overlay">
                    <p class="slide-description">{{ slide.description }}</p>
                </div>
            </div>
            {% endfor %}

            <div class="tap-zones">
                <div class="tap-zone" id="prevZone"></div>
                <div class="tap-zone" id="nextZone"></div>
            </div>

            <button class="nav-btn prev-btn" id="prevBtn">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="nav-btn next-btn" id="nextBtn">
                <i class="fas fa-chevron-right"></i>
            </button>

            <button class="share-btn" onclick="shareStory()">
                <i class="fas fa-share-alt"></i>
            </button>

            <div class="paused-overlay" id="pausedOverlay">
                <i class="fas fa-pause"></i>
            </div>
        </div>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        const progressBars = document.querySelectorAll('.progress-bar-item');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const prevZone = document.getElementById('prevZone');
        const nextZone = document.getElementById('nextZone');
        const pausedOverlay = document.getElementById('pausedOverlay');
        
        let currentIndex = 0;
        let isPaused = false;
        let progressInterval;
        const slideDuration = {{ slides.0.duration|default:5 }} * 1000;

        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
                progressBars[i].classList.toggle('completed', i < index);
                progressBars[i].classList.toggle('active', i === index);
            });

            currentIndex = index;
            updateButtons();
            startProgress();

            const video = slides[index].querySelector('video');
            if (video) {
                video.currentTime = 0;
                video.play();
            }
        }

        function startProgress() {
            clearInterval(progressInterval);
            if (isPaused) return;

            const activeBar = progressBars[currentIndex].querySelector('.progress-bar-fill');
            const startTime = Date.now();

            progressInterval = setInterval(() => {
                if (isPaused) return;
                
                const elapsed = Date.now() - startTime;
                const progress = (elapsed / slideDuration) * 100;
                activeBar.style.width = progress + '%';

                if (progress >= 100) {
                    clearInterval(progressInterval);
                    if (currentIndex < slides.length - 1) {
                        showSlide(currentIndex + 1);
                    }
                }
            }, 50);
        }

        function togglePause() {
            isPaused = !isPaused;
            pausedOverlay.classList.toggle('show', isPaused);
            
            const video = slides[currentIndex].querySelector('video');
            if (video) {
                isPaused ? video.pause() : video.play();
            }

            if (!isPaused) {
                startProgress();
            }
        }

        function updateButtons() {
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === slides.length - 1;
        }

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                showSlide(currentIndex - 1);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < slides.length - 1) {
                showSlide(currentIndex + 1);
            }
        });

        prevZone.addEventListener('click', () => {
            if (currentIndex > 0) {
                showSlide(currentIndex - 1);
            }
        });

        nextZone.addEventListener('click', () => {
            if (currentIndex < slides.length - 1) {
                showSlide(currentIndex + 1);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && currentIndex > 0) {
                showSlide(currentIndex - 1);
            } else if (e.key === 'ArrowRight' && currentIndex < slides.length - 1) {
                showSlide(currentIndex + 1);
            } else if (e.key === ' ') {
                e.preventDefault();
                togglePause();
            }
        });

        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchStartX - touchEndX > 50) {
                if (currentIndex < slides.length - 1) {
                    showSlide(currentIndex + 1);
                }
            }
            if (touchEndX - touchStartX > 50) {
                if (currentIndex > 0) {
                    showSlide(currentIndex - 1);
                }
            }
        }

        function shareStory() {
            if (navigator.share) {
                navigator.share({
                    title: '{{ story.title }}',
                    text: 'Check out this story!',
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('Link copied to clipboard!');
            }
        }

        showSlide(0);
    </script>
</body>
</html>
